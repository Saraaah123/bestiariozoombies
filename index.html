<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Walking Spinner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>THE WALKING SPINNER</h1>

  <div id="cuerpo">
    <div class="parte" id="caja-head"><img id="img-head" alt="cabeza"></div>
    <div class="parte" id="caja-torso"><img id="img-torso" alt="torso"></div>
    <div class="parte" id="caja-legs"><img id="img-legs" alt="piernas"></div>
  </div>

  <button id="girar">¡GIRAR LA RULETA!</button>

  
  <div id="resultado">
    <p id="mensaje"></p>
    <p id="nombre"></p>
  </div>

<script src="script.js"></script>
</body>
</html>
